{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  #name: {{ include "heycoach-helm.serviceAccountName" . }}
   name: {{ .Release.Name }}-helm-infra
  #namespace: {{ .Values.namespace }}
  labels:
    {{- include "heycoach-helm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
