apiVersion: v1
kind: Service
metadata:
  name: {{ include "heycoach-helm.fullname" . }}
  #name: {{ .Release.Name }}-helm-infra
  labels:
    {{- include "heycoach-helm.labels" . | nindent 4 }}
  annotations:
    {{- include "heycoach-helm.annotations" . | nindent 4 }}
  #namespace: {{ .Release.Namespace }}
   namespace: {{ .Release.Namespace }}

spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: web
    {{- if .Values.service.additionalPorts }}
    {{- range $servicePort := .Values.service.additionalPorts }}
    - name: {{ $servicePort.name }}
      port: {{ $servicePort.port }} 
      {{- if $servicePort.protocol }}
      protocol: {{ $servicePort.protocol | default "TCP" }} 
      {{- end }}
      targetPort: {{ $servicePort.targetPort }}
    {{- end }}
    {{- end }}
  selector:
    {{- include "heycoach-helm.selectorLabels" . | nindent 4 }}

